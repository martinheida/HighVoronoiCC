name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            libeigen3-dev \
            libboost-dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure documentation build
        run: |
          cmake -S . -B build/docs \
            -DHIGHVORONOI_BUILD_DOCS=ON \
            -DHIGHVORONOI_BUILD_TESTS=OFF \
            -DHIGHVORONOI_BUILD_EXAMPLES=OFF \
            -DHIGHVORONOI_BUILD_BENCHMARKS=OFF

      - name: Build documentation
        run: cmake --build build/docs --target docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/manual/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
